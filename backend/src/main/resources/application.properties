spring.application.name=magam-beauty
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.file-size-threshold=11MB
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.accept-float-as-int=false
logging.level.org.springframework.web=INFO
server.tomcat.max-part-count=3
server.tomcat.threads.max=30
magam.openai.api-key=${OPENAI_API_KEY:}
magam.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
magam.access-key=${APP_ACCESS_KEY:}
